<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Physarum</title>

        <link rel="stylesheet" href="/css/style.css" />
    </head>

    <body>
        <canvas id="c"></canvas>

        <div id="menu">
            <button id="menuButton" aria-label="Open menu">☰</button>

            <div id="menuPanel">
                <button id="backToLauncherButton" class="menuActionButton">
                    Back to games
                </button>

                <label>
                    Alive density
                    <span id="thresholdText">0.50</span>
                    <input
                        type="range"
                        id="thresholdSlider"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.5"
                    />
                </label>

                <button id="generateSeedButton" class="menuActionButton">
                    Generate seed
                </button>
            </div>
        </div>

        <script src="/libs/three.min.js"></script>
        <script type="module" src="/games/physarum/js/physarum.js"></script>
    </body>
</html>
