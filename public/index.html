<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Shader Games</title>

        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <div id="launcher" class="launcher">
            <div class="launcherCard">
                <div class="launcherTitle">Shader Games</div>
                <div class="launcherSubtitle">
                    Pick a GLSL game to start.
                </div>
                <div id="gameList" class="launcherList"></div>
            </div>
        </div>

        <div id="gameRoot" style="display: none">
            <canvas id="c"></canvas>

            <div id="menu">
                <button id="menuButton" aria-label="Open menu">☰</button>

                <div id="menuPanel">
                    <button id="backToLauncherButton" class="menuActionButton">
                        Back to games
                    </button>

                    <label>
                        Paint tool
                        <select id="paintToolSelect">
                            <option value="brush" selected>Paintbrush</option>
                            <option value="single_cell">Single cell</option>
                            <option value="glider_gun">Glider gun (small)</option>
                            <option value="gosper_glider_gun">
                                Gosper glider gun
                            </option>
                            <option value="simkin_glider_gun">
                                Simkin glider gun (period 120)
                            </option>
                            <option value="pulsar">Pulsar (period 3)</option>
                            <option value="acorn">Acorn (methuselah)</option>
                            <option value="r_pentomino">
                                R-pentomino (methuselah)
                            </option>
                            <option value="lwss">
                                LWSS (lightweight spaceship)
                            </option>
                        </select>
                    </label>

                    <label>
                        Zoom
                        <input
                            type="range"
                            id="zoomSlider"
                            min="0.05"
                            max="1"
                            step="0.05"
                            value="1"
                        />
                    </label>

                    <label id="brushSliderLabel">
                        Brush Size
                        <input
                            type="range"
                            id="brushSlider"
                            min="1"
                            max="10"
                            step="1"
                            value="6"
                        />
                    </label>

                    <label>
                        Target Framerate:
                        <span id="fpsText">INF</span>
                        <input
                            type="range"
                            id="speedSlider"
                            min="1"
                            max="61"
                            step="1"
                            value="61"
                        />
                    </label>

                    <label>
                        Pause
                        <span id="pauseAdditional">
                            Use the 'n' key to progress simulation by 1 frame
                        </span>
                        <input type="checkbox" id="pauseToggle" />
                    </label>

                    <label>
                        Grid
                        <input type="checkbox" id="gridToggle" />
                    </label>

                    <label>
                        Image
                        <select id="imageSelect"></select>
                    </label>
                </div>
            </div>
        </div>

        <script src="libs/three.min.js"></script>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
