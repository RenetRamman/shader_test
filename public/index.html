<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Test shader</title>

        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <html>
            <head>
                <title>test shader</title>
            </head>
            <canvas id="c"></canvas>
            <canvas id="c"></canvas>

            <div id="menu">
                <button id="menuButton">☰</button>

                <div id="menuPanel">
                    <label>
                        Zoom
                        <input
                            type="range"
                            id="zoomSlider"
                            min="0.05"
                            max="1"
                            step="0.05"
                            value="1"
                        />
                    </label>

                    <label>
                        Brush Size
                        <input
                            type="range"
                            id="brushSlider"
                            min="0"
                            max="10"
                            step="1"
                            value="1"
                        />
                    </label>

                    <label>
                        Target Framerate:
                        <span id="fpsText">INF</span>
                        <input
                            type="range"
                            id="speedSlider"
                            min="1"
                            max="61"
                            step="1"
                            value="61"
                        />
                    </label>

                    <label>
                        Pause
                        <span id="pauseAdditional">
                            Use the 'n' key to progress simulation by 1 frame
                        </span>
                        <input type="checkbox" id="pauseToggle" />
                    </label>

                    <label>
                        Grid
                        <input type="checkbox" id="gridToggle" />
                    </label>

                    <label
                        >Image
                        <select id="imageSelect"></select>
                    </label>
                </div>
            </div>

            <body></body>
        </html>
        <script src="libs/three.min.js"></script>

        <script type="module" src="js/index.js"></script>
    </body>
</html>
